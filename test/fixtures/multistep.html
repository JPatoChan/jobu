<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply: Data Analyst - Globex</title>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Data Analyst","hiringOrganization":{"@type":"Organization","name":"Globex"},"jobLocation":{"@type":"Place","address":{"addressLocality":"Austin","addressRegion":"TX"}}}</script>
  <style>
    :root { color-scheme: light; }
    [hidden] { display: none !important; }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #1f2937; background: #fff; }
    .cookie-banner { position: fixed; left: 16px; bottom: 16px; background: #111827; color: #fff; padding: 10px 14px; border-radius: 8px; }
    .progress { display: flex; gap: 16px; padding: 0; list-style: none; color: #9ca3af; }
    .progress [aria-current="step"] { color: #111827; font-weight: 700; }
    .field { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }
    input, select, textarea { font: inherit; padding: 6px 8px; }
    fieldset { border: 0; padding: 0; margin: 12px 0; }
    .errors { color: #b91c1c; font-weight: 600; }
    .nav { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .nav button { font: inherit; padding: 8px 16px; }
  </style>
</head>
<body>
  <div id="cookie-banner" class="cookie-banner">We use cookies. <button type="button" onclick="this.parentElement.remove()">Continue</button></div>
  <header>
    <h1>Data Analyst</h1>
    <p>Globex · Austin, TX</p>
    <button type="button">Apply with LinkedIn</button>
  </header>
  <ol class="progress">
    <li aria-current="step">My information</li>
    <li>Questions</li>
    <li>Review</li>
  </ol>

  <form id="app" novalidate>
    <section data-step="1">
      <h2>My information</h2>
      <div class="field"><label for="fn">First name *</label><input id="fn" name="firstName" required></div>
      <div class="field"><label for="ln">Last name *</label><input id="ln" name="lastName" required></div>
      <div class="field"><label for="em">Email *</label><input id="em" type="email" required></div>
      <div class="field"><label for="ph">Phone</label><input id="ph" type="tel"></div>
      <div class="field"><label for="country">Country</label>
        <select id="country"><option value="">Select one</option><option>Canada</option><option>United States of America</option></select></div>
    </section>

    <section data-step="2" hidden>
      <h2>Application questions</h2>
      <fieldset><legend>Are you legally authorized to work in the United States? *</legend>
        <label><input type="radio" name="auth" value="yes" required> Yes</label>
        <label><input type="radio" name="auth" value="no"> No</label></fieldset>
      <div class="field"><label for="sponsor">Will you require visa sponsorship? *</label>
        <select id="sponsor" required><option value="">Select one</option><option>Yes</option><option>No</option></select></div>
      <div class="field"><label for="why">Why do you want to join Globex? *</label><textarea id="why" required></textarea></div>
      <div class="field"><label for="hear">How did you hear about us?</label>
        <select id="hear"><option value="">Select one</option><option>LinkedIn</option><option>Referral</option><option>Other</option></select></div>
    </section>

    <section data-step="3" hidden>
      <h2>Review</h2>
      <dl id="summary"></dl>
      <label><input type="checkbox" id="certify" required> I certify that the information I provided is accurate. *</label>
    </section>

    <p class="errors" role="alert" hidden></p>
    <div class="nav">
      <button type="button" id="back">Back</button>
      <button type="button" id="next" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
      <button type="submit" id="submit">Submit application</button>
    </div>
  </form>

  <section id="done" hidden>
    <h2>Thank you for applying!</h2>
    <p>Your application has been submitted. We'll be in touch.</p>
  </section>

  <script>
    // A Workday-like single-page flow: steps swap in place, Next validates
    // and "saves" for a moment, and Submit shows a confirmation.
    (function () {
      const $ = (id) => document.getElementById(id);
      const form = $('app');
      const steps = [...form.querySelectorAll('[data-step]')];
      const crumbs = [...document.querySelectorAll('.progress li')];
      const errors = form.querySelector('.errors');
      let step = 0;

      function show(i) {
        step = i;
        steps.forEach((s, j) => (s.hidden = j !== i));
        crumbs.forEach((c, j) => (j === i ? c.setAttribute('aria-current', 'step') : c.removeAttribute('aria-current')));
        $('back').hidden = i === 0;
        $('next').hidden = i === steps.length - 1;
        $('submit').hidden = i !== steps.length - 1;
        errors.hidden = true;
        if (i === steps.length - 1) summarize();
      }

      function valid(section) {
        let bad = 0;
        for (const el of section.querySelectorAll('[required]')) {
          const ok = el.type === 'radio' ? !!section.querySelector(`[name="${el.name}"]:checked`)
            : el.type === 'checkbox' ? el.checked : !!el.value.trim();
          el.setAttribute('aria-invalid', String(!ok));
          if (!ok) bad++;
        }
        errors.textContent = bad ? `Please complete ${bad} required field${bad === 1 ? '' : 's'}.` : '';
        errors.hidden = !bad;
        return !bad;
      }

      function summarize() {
        const auth = form.querySelector('[name=auth]:checked');
        const rows = [
          ['Name', `${$('fn').value} ${$('ln').value}`],
          ['Email', $('em').value],
          ['Authorized to work', auth ? auth.value : '-'],
          ['Sponsorship', $('sponsor').value || '-'],
        ];
        $('summary').replaceChildren(...rows.flatMap(([k, v]) => [
          Object.assign(document.createElement('dt'), { textContent: k }),
          Object.assign(document.createElement('dd'), { textContent: v }),
        ]));
      }

      $('next').addEventListener('click', () => {
        if (valid(steps[step])) setTimeout(() => show(step + 1), 300); // pretend to save
      });
      $('back').addEventListener('click', () => show(step - 1));
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!valid(steps[step])) return;
        setTimeout(() => {
          form.hidden = true;
          document.querySelector('.progress').hidden = true;
          $('done').hidden = false;
        }, 300);
      });
      show(0);
    })();
  </script>
</body>
</html>
